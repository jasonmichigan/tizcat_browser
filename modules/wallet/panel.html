<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>JibWallet</title>
  <link rel="stylesheet" href="panel.css">
  <script src="panel.js" defer></script>
</head>
<body>
  <!-- JibWallet's toolbar panel, laid out like Brave Wallet's "Unlock Wallet"
       panel. A placeholder: JibWallet itself is not built yet, so the field
       and buttons are switched off and nothing here takes a password. -->
  <button id="settings" class="icon-btn" title="JibWallet settings" aria-label="JibWallet settings">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
  </button>

  <header class="brand">
    <img src="icons/tizcat_64.png" width="32" height="32" alt="">
    <span class="wordmark">JibWallet</span>
  </header>
  <div class="badge-row"><span id="status" class="badge">Coming soon</span></div>

  <main class="unlock">
    <svg class="lock" viewBox="0 0 120 120" width="96" height="96" aria-hidden="true">
      <defs>
        <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f3c766"/>
          <stop offset="1" stop-color="#c98d22"/>
        </linearGradient>
        <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#d3d8e1"/>
          <stop offset="1" stop-color="#8d96a8"/>
        </linearGradient>
      </defs>
      <circle cx="60" cy="62" r="56" class="halo halo-1"/>
      <circle cx="60" cy="62" r="44" class="halo halo-2"/>
      <path d="M42 56V42a18 18 0 0 1 36 0v14" fill="none" stroke="url(#steel)" stroke-width="9" stroke-linecap="round"/>
      <rect x="28" y="52" width="64" height="48" rx="11" fill="url(#gold)"/>
      <rect x="33" y="56" width="54" height="6" rx="3" fill="#fff" opacity=".35"/>
      <circle cx="60" cy="72" r="6.5" fill="#1c2b4a"/>
      <rect x="57.25" y="74" width="5.5" height="13" rx="2.75" fill="#1c2b4a"/>
    </svg>

    <h1>Unlock JibWallet</h1>
    <p class="sub">Enter your password to unlock JibWallet</p>

    <div class="field">
      <input id="password" type="password" placeholder="Enter your password"
             autocomplete="off" disabled aria-describedby="note">
      <button id="show" class="eye" type="button" disabled aria-label="Show password">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
      </button>
    </div>
    <button id="unlock" class="primary" type="button" disabled>Unlock</button>
    <button id="restore" class="pill" type="button" disabled>Restore</button>
  </main>

  <p id="note" class="note">JibWallet is not ready yet. This is where you will unlock it.
    Until then, your TizCat Rewards points are kept for you.
    <a id="learn" href="https://tizcat.com/go/wallet" target="_blank">Learn more</a></p>
</body>
</html>
